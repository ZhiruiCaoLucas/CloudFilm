# ---------------------------------------------------------------------------
# CloudFilm OHIF reverse proxy.
#
# This nginx serves the unmodified OHIF bundle and is the ONLY route from a
# browser to DICOM data. Orthanc has no published port in the production stack;
# it is reachable solely through the /dicom-web location below, on the internal
# Docker network.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Deliberately NOT setting Cross-Origin-Embedder-Policy.
    #
    # COEP is what OHIF needs for SharedArrayBuffer, which its volume/3D
    # rendering path uses. But SharedArrayBuffer requires the whole chain to be
    # cross-origin isolated, and CloudFilm embeds the viewer in an iframe: the
    # portal would have to send COOP and COEP as well, and every OHIF subresource
    # would need CORP. Enabling it on this server alone buys nothing and can
    # block resources. 2D review - pan, zoom, window/level - does not need it.
    # It is turned on, on both origins together, when 3D lands.
    #
    # No X-Frame-Options and no frame-ancestors here either: this document is
    # meant to be framed by the portal. Restricting the embedder to the portal
    # origin belongs with the ingress configuration, not with a dev default.

    # Single page application: unknown paths are handled by the OHIF router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /dicom-web/ {
        proxy_pass              http://orthanc:8042/dicom-web/;
        proxy_http_version      1.1;
        proxy_set_header        Host $host;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        # No credentials are attached here.
        #
        # Local development runs Orthanc with authentication disabled (see
        # services/orthanc/zz-dev.json), so none are needed. A deployment with
        # authentication on must inject a Basic credential at this hop, from a
        # secret, so it never reaches the browser - that arrives with real
        # authentication rather than being faked now.

        # Large CT and CBCT series stream rather than buffer.
        proxy_buffering         off;
        proxy_read_timeout      300s;
        client_max_body_size    0;
    }
}
