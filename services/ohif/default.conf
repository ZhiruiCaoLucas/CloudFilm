# ---------------------------------------------------------------------------
# CloudFilm OHIF reverse proxy.
#
# This nginx serves the unmodified OHIF bundle and is the ONLY route from a
# browser to DICOM data. Orthanc has no published port; it is reachable solely
# through the /dicom-web location below, on the internal Docker network.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Cross-origin isolation, required by OHIF for SharedArrayBuffer backed
    # volume rendering (the 3D viewer).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Single page application: unknown paths are handled by the OHIF router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /dicom-web/ {
        proxy_pass              http://orthanc:8042/dicom-web/;
        proxy_http_version      1.1;
        proxy_set_header        Host $host;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        # Orthanc credentials are attached here so they never reach the browser.
        proxy_set_header        Authorization $http_authorization;
        proxy_pass_header       Authorization;

        # Large CT and CBCT series stream rather than buffer.
        proxy_buffering         off;
        proxy_read_timeout      300s;
        client_max_body_size    0;
    }
}
