name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  backend:
    name: Backend (build and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore CloudFilm.sln

      # Warnings are errors repository-wide (Directory.Build.props), so a build
      # that succeeds here is warning-free by construction.
      - run: dotnet build CloudFilm.sln --configuration Release --no-restore

      - run: dotnet test CloudFilm.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm format:check

      # Deliberately runs with no environment at all. A fresh clone must build
      # and run with zero configuration, and this step is what keeps that true.
      - name: Build portal (no configuration)
        run: pnpm build

  analysis:
    name: Analysis service (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the interpreter the image is built on, so a syntax or library
      # difference shows up here rather than in a container nobody can debug.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/analysis/requirements-dev.txt

      - run: pip install --requirement apps/analysis/requirements-dev.txt

      # Run from the service's own directory: its conftest.py puts the package on
      # the path, and the suite is self-contained - every DICOM in it is
      # synthesised in memory, so there is no fixture to fetch and no sample study
      # to keep.
      - name: pytest
        working-directory: apps/analysis
        run: python -m pytest tests -q

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, frontend, analysis]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/api.Dockerfile
          - name: retrieve
            dockerfile: docker/retrieve.Dockerfile
          - name: portal
            dockerfile: docker/portal.Dockerfile
          # The one Dockerfile outside docker/: it lives beside the service it
          # builds, which is the only one that is neither .NET nor Node.
          - name: analysis
            dockerfile: apps/analysis/docker/analysis.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: CI proves every image is buildable from a clean
      # checkout. Publishing is handled by the release workflow.
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validates interpolation and schema without starting anything.
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
