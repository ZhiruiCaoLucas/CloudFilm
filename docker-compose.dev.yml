# ---------------------------------------------------------------------------
# Development overlay.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Publishes the data tier to the host and turns Orthanc's authentication off so
# a developer can load sample DICOM and browse it directly.
#
# NEVER apply this overlay to a hospital deployment. It removes the network
# isolation that keeps PostgreSQL, Redis and Orthanc unreachable from outside
# the compose network, and it unauthenticates the imaging tier.
# ---------------------------------------------------------------------------

services:
  postgres:
    ports:
      - '5432:5432'

  redis:
    ports:
      - '6379:6379'

  orthanc:
    # zz-dev.json sorts after orthanc.json, and Orthanc lets the last file read
    # win, so this overrides the production defaults without editing them.
    volumes:
      - ./services/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./services/orthanc/zz-dev.json:/etc/orthanc/zz-dev.json:ro
      - orthanc-storage:/var/lib/orthanc/db
    ports:
      - '8042:8042'

  # These previously downgraded to service_started, to work around an Orthanc
  # health check that could never pass. That workaround is removed: masking a
  # broken health check is what let the real fault go unnoticed. Development and
  # production now gate identically, so a probe that breaks fails visibly here
  # first. To bring one service up regardless while debugging:
  #   docker compose up -d --no-deps ohif
  retrieve:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - '8082:8080'

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
