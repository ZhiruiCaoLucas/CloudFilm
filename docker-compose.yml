# ---------------------------------------------------------------------------
# CloudFilm - full stack.
#
# Network segmentation is the core security control here:
#
#   edge      portal, ohif, api          reachable from the host / ingress
#   internal  api, retrieve, orthanc,    no published ports, ever
#             postgres, redis
#
# Orthanc, PostgreSQL and Redis are attached to `internal` only. A browser can
# reach DICOM data exclusively through the OHIF service's reverse proxy, so the
# imaging tier is never addressable from outside the compose network.
# ---------------------------------------------------------------------------

name: cloudfilm

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by scripts/init-databases.sh, which runs in THIS container. The
      # same value is given to Orthanc below, so the role it creates and the
      # credential Orthanc connects with cannot drift apart.
      ORTHANC_DB_PASSWORD: ${ORTHANC_DB_PASSWORD:?set ORTHANC_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      # pg_isready ships with the official image. -h 127.0.0.1 is load-bearing:
      # during first-run initialisation the entrypoint starts PostgreSQL with
      # listen_addresses='' - reachable over the Unix socket only - so a socket
      # probe reports healthy while /docker-entrypoint-initdb.d scripts are still
      # running. Orthanc would then start before its role exists. Forcing TCP
      # keeps the container unhealthy until initialisation has really finished.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    <<: *restart
    image: redis:7-alpine
    command:
      ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory-policy', 'volatile-ttl']
    healthcheck:
      # redis-cli is part of the official Redis image - it is the image's own
      # client, not an add-on - and exits non-zero when the server does not
      # answer. Nothing to replace here.
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  orthanc:
    <<: *restart
    image: ${ORTHANC_IMAGE:-orthancteam/orthanc:25.4.2}

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ORTHANC__REGISTERED_USERS__cloudfilm: ${ORTHANC_PASSWORD}
      ORTHANC__POSTGRESQL__PASSWORD: ${ORTHANC_DB_PASSWORD:?set ORTHANC_DB_PASSWORD in .env}
      VERBOSE_STARTUP: 'true'

    volumes:
      - ./services/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-storage:/var/lib/orthanc/db

    ports:
      - '8042:8042'

    healthcheck:
      test: ['CMD', 'python3', '/probes/test-aliveness.py']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks: [internal]

  retrieve:
    <<: *restart
    build:
      context: .
      dockerfile: docker/retrieve.Dockerfile
    depends_on:
      orthanc:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Retrieve__OrthancUrl: 'http://orthanc:8042'
      # The user Orthanc registers above. Only Retrieve receives these: it is the
      # only component permitted to reach the imaging tier.
      Retrieve__OrthancUsername: cloudfilm
      Retrieve__OrthancPassword: ${ORTHANC_PASSWORD}
      Retrieve__StagingLifetime: '${RETRIEVE_STAGING_LIFETIME:-12:00:00}'
    healthcheck:
      # The .NET runtime images contain no HTTP client: Microsoft excludes curl,
      # and there is no wget either. Rather than install one, this speaks HTTP
      # over bash's /dev/tcp using only bash, printf, head and grep - all of
      # which are Essential packages in the Ubuntu base these images are built
      # on. It asserts a 200 from the real endpoint, so it is a genuine health
      # probe and not merely a TCP connect. Do not switch these services to a
      # -chiseled tag without replacing this: chiselled images have no shell.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]

  api:
    <<: *restart
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      retrieve:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Infrastructure__PostgresConnectionString: 'Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}'
      Infrastructure__RedisConnectionString: 'redis:6379'
      Infrastructure__RedisInstanceName: 'cloudfilm:'
      Infrastructure__AutoMigrate: ${API_AUTO_MIGRATE:-true}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      # The first administrator account, created at start-up when both values
      # are set. Left empty the seeder does nothing and the API still starts,
      # which is what a deployment that provisions accounts elsewhere wants.
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      Portal__AllowedOrigins__0: ${PORTAL_PUBLIC_URL}
      Downstream__RetrieveServiceUrl: 'http://retrieve:8080'
      Downstream__OrthancUrl: 'http://orthanc:8042'
    ports:
      - '${API_PUBLIC_PORT:-8088}:8080'
    healthcheck:
      # The .NET runtime images contain no HTTP client: Microsoft excludes curl,
      # and there is no wget either. Rather than install one, this speaks HTTP
      # over bash's /dev/tcp using only bash, printf, head and grep - all of
      # which are Essential packages in the Ubuntu base these images are built
      # on. It asserts a 200 from the real endpoint, so it is a genuine health
      # probe and not merely a TCP connect. Do not switch these services to a
      # -chiseled tag without replacing this: chiselled images have no shell.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [edge, internal]

  ohif:
    <<: *restart
    # Version-pinned, never :latest. The 'v' prefix is part of OHIF's tag
    # format; ohif/app:3.6.1 does not exist.
    image: ${OHIF_IMAGE:-ohif/app:v3.6.1}
    depends_on:
      orthanc:
        condition: service_healthy
    environment:
      # Base64 of cloudfilm:<ORTHANC_PASSWORD>. Only nginx sees it; the browser
      # reaches DICOMweb through this proxy and never holds a credential.
      ORTHANC_BASIC_AUTH: ${ORTHANC_BASIC_AUTH:?set in .env - printf 'cloudfilm:%s' "$ORTHANC_PASSWORD" | base64}
      # Consumed by the envsubst below. The image's entrypoint defaults these
      # internally, but our command runs in a fresh shell and would otherwise
      # substitute them to empty, producing "listen  default_server;".
      PORT: '80'
      PUBLIC_URL: /
    volumes:
      - ./services/ohif/app-config.js:/usr/share/nginx/html/app-config.js
      - ./services/ohif/default.conf.template:/usr/src/default.conf.template
    # The image's entrypoint substitutes only ${PORT} and ${PUBLIC_URL}, so
    # ${ORTHANC_BASIC_AUTH} reached nginx literally and nginx parsed it as its
    # own ${name} variable syntax - "unknown orthanc_basic_auth variable", and
    # the container restart-looped.
    #
    # This re-renders the template with all three named explicitly. The list is
    # explicit on purpose: it substitutes exactly these and leaves $host,
    # $http_host, $uri and every other nginx variable untouched. The entrypoint
    # still runs first, so any other setup the image performs is preserved.
    command:
      - /bin/sh
      - -c
      - >-
        envsubst '$$PORT $$PUBLIC_URL $$ORTHANC_BASIC_AUTH'
        < /usr/src/default.conf.template
        > /etc/nginx/conf.d/default.conf
        && exec nginx -g 'daemon off;'
    ports:
      - '${VIEWER_PUBLIC_PORT:-8081}:80'
    networks: [edge, internal]

  portal:
    <<: *restart
    build:
      context: .
      dockerfile: docker/portal.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      CLOUDFILM_API_URL: 'http://api:8080'
      CLOUDFILM_VIEWER_URL: ${VIEWER_PUBLIC_URL}
    ports:
      - '${PORTAL_PUBLIC_PORT:-3002}:3000'
    healthcheck:
      # node is the one binary this image is guaranteed to have - it is what the
      # image exists for. The previous check used busybox wget, which is an
      # Alpine detail: moving the base to node:22-slim, which is Debian and
      # ships neither wget nor curl, would have broken it silently.
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3000/api/health").then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [edge, internal]

networks:
  edge:
    driver: bridge

  # A normal bridge network with no published ports. Docker's `internal: true`
  # is deliberately NOT set: the Retrieve Service needs egress to reach a
  # hospital archive. Isolation here comes from not publishing ports, not from
  # cutting off outbound traffic.
  internal:
    driver: bridge

volumes:
  postgres-data:
  orthanc-storage:
